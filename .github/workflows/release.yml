name: release

# Publishes the version written in the TOC. Runs when a matching tag is pushed,
# or by hand from the Actions tab, in which case the release creates the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the TOC
        id: version
        run: |
          toc_version="$(sed -n 's/^## Version: //p' WarcraftBets.toc | tr -d '\r')"
          tag="v${toc_version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match TOC version ${toc_version}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build the zip
        run: make zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: >
          gh release create "${TAG}" dist/WarcraftBets.zip
          --target "${GITHUB_SHA}"
          --title "WarcraftBets ${TAG}"
          --generate-notes
