name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the TOC version
        run: |
          toc_version="$(sed -n 's/^## Version: //p' WarcraftBets.toc | tr -d '\r')"
          if [ "v${toc_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match TOC version ${toc_version}" >&2
            exit 1
          fi

      - name: Build the zip
        run: make zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/WarcraftBets.zip --title "WarcraftBets ${GITHUB_REF_NAME}" --generate-notes
